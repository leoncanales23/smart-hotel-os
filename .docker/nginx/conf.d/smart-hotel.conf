# ============================================================
#  SmartHotelOS — Configuración Nginx
#  Grupo Smart de Administración
#  /etc/nginx/conf.d/smart-hotel.conf
# ============================================================

# ── Upstream PHP-FPM ─────────────────────────────────────────
upstream smart_php_fpm {
    server php:9000;
    keepalive 32;
}

# ── Rate limiting para la API ─────────────────────────────────
limit_req_zone $http_x_api_key zone=smart_api:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=smart_web:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=smart_conn:10m;

# ── Gzip ─────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript
           application/json application/javascript application/xml
           application/x-font-ttf font/opentype image/svg+xml;

# ── Servidor HTTP → redirigir a HTTPS ────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── Servidor principal HTTPS ──────────────────────────────────
server {
    listen 443 ssl http2;
    server_name smarthotel.local localhost;

    root /var/www/html;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    # ── SSL ──────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/smart-hotel.crt;
    ssl_certificate_key /etc/nginx/ssl/smart-hotel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"           always;
    add_header X-Content-Type-Options     "nosniff"              always;
    add_header X-XSS-Protection           "1; mode=block"        always;
    add_header Referrer-Policy            "strict-origin"        always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    add_header X-SmartHotelOS-Version     "1.0.0"                always;

    # ── Logs ─────────────────────────────────────────────────
    access_log /var/log/nginx/smart-hotel-access.log combined buffer=16k flush=5s;
    error_log  /var/log/nginx/smart-hotel-error.log warn;

    # ── Bloquear archivos sensibles ──────────────────────────
    location ~ /\.(env|git|htaccess|DS_Store) {
        deny all;
        return 404;
    }
    location ~ \.(sql|log|bak|conf|md|json|lock)$ {
        deny all;
        return 404;
    }
    location ~ ^/(scripts|tests|docs)/ {
        deny all;
        return 404;
    }

    # ── API REST SmartHotelOS ─────────────────────────────────
    location /api/smart/v1/ {
        limit_req zone=smart_api burst=20 nodelay;
        limit_conn smart_conn 10;

        # CORS headers
        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-API-Key" always;
        add_header Access-Control-Max-Age       "86400" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        try_files $uri $uri/ /index.php?controller=SmartApi&$query_string;
    }

    # ── WebSocket para tiempo real ────────────────────────────
    location /ws/smart-hotel {
        proxy_pass         http://smart_ws_server;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── WhatsApp Webhook ─────────────────────────────────────
    location /webhook/whatsapp {
        # Solo Meta Cloud API
        allow 31.13.24.0/21;
        allow 31.13.64.0/18;
        allow 45.64.40.0/22;
        allow 66.220.144.0/20;
        allow 69.63.176.0/20;
        allow 69.171.224.0/19;
        allow 74.119.76.0/22;
        allow 103.4.96.0/22;
        allow 157.240.0.0/17;
        allow 173.252.64.0/18;
        allow 204.15.20.0/22;
        deny all;

        try_files $uri /index.php?controller=SmartWebhook&type=whatsapp&$query_string;
    }

    # ── Admin panel ───────────────────────────────────────────
    location ~* ^/admin-smart {
        # Restringir por IP en producción (descomentar)
        # allow 192.168.1.0/24;
        # deny all;

        try_files $uri $uri/ /admin-smart/index.php$is_args$args;
    }

    # ── Assets estáticos — cache agresivo ────────────────────
    location ~* \.(ico|css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary          "Accept-Encoding";
        access_log off;
        try_files $uri =404;
    }

    # ── PHP-FPM principal ─────────────────────────────────────
    location / {
        limit_req zone=smart_web burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass   smart_php_fpm;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;
        include        fastcgi_params;

        fastcgi_buffer_size       128k;
        fastcgi_buffers           4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout      300;

        # Pasar variables de entorno al PHP
        fastcgi_param  APP_ENV      $app_env;
        fastcgi_param  SERVER_NAME  $server_name;
    }
}

# ── Upstream WebSocket (Fase 4) ───────────────────────────────
upstream smart_ws_server {
    server node:3001;
}

# ── Variables de entorno Nginx ────────────────────────────────
map $http_x_forwarded_proto $app_env {
    default "production";
}
