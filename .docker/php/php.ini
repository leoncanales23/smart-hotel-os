; ============================================================
;  SmartHotelOS — PHP Configuration
;  Grupo Smart de Administración
; ============================================================

[PHP]
; Error reporting (desactivar en producción)
display_errors        = Off
display_startup_errors= Off
log_errors            = On
error_log             = /var/log/php/error.log
error_reporting       = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Ejecución
max_execution_time    = 300
max_input_time        = 300
memory_limit          = 512M

; Subida de archivos (para documentos de huéspedes, fotos, etc.)
file_uploads          = On
upload_max_filesize   = 64M
max_file_uploads      = 20
post_max_size         = 64M

; Variables
max_input_vars        = 5000
variables_order       = "GPCS"

; Timezone
date.timezone         = America/Santiago

; Charset
default_charset       = "UTF-8"

; Session (segura para el panel admin)
[Session]
session.name              = SMART_SESS
session.use_strict_mode   = 1
session.use_only_cookies  = 1
session.cookie_httponly   = 1
session.cookie_samesite   = "Lax"
session.gc_maxlifetime    = 7200
session.gc_probability    = 1
session.gc_divisor        = 100

[opcache]
opcache.enable                 = 1
opcache.memory_consumption     = 256
opcache.interned_strings_buffer= 16
opcache.max_accelerated_files  = 20000
opcache.validate_timestamps    = 1
opcache.revalidate_freq        = 2
opcache.fast_shutdown          = 1

[curl]
curl.cainfo = /etc/ssl/certs/ca-certificates.crt
