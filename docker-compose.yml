version: '3.9'

# ============================================================
#  SmartHotelOS — Stack de Desarrollo Completo
#  Grupo Smart de Administración
# ============================================================

services:

  # ── Servidor Web (Nginx) ──────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: smart_nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./core:/var/www/html
      - ./smart-modules:/var/www/html/modules/smart
      - ./smart-themes:/var/www/html/themes/smart-luxury
      - ./.docker/nginx/conf.d:/etc/nginx/conf.d
      - ./.docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - php
    networks:
      - smart_network
    labels:
      - "traefik.enable=true"

  # ── PHP-FPM 8.2 ──────────────────────────────────────────
  php:
    build:
      context: ./.docker/php
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "8.2"
    container_name: smart_php
    volumes:
      - ./core:/var/www/html
      - ./smart-modules:/var/www/html/modules/smart
      - ./smart-themes:/var/www/html/themes/smart-luxury
      - ./.docker/php/php.ini:/usr/local/etc/php/php.ini
    environment:
      - APP_ENV=development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-smart_hotel_db}
      - DB_USER=${DB_USER:-smart_user}
      - DB_PASSWORD=${DB_PASSWORD:-smart_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smart_network

  # ── MySQL 8.0 ─────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: smart_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_smart_2024}
      MYSQL_DATABASE: ${DB_NAME:-smart_hotel_db}
      MYSQL_USER: ${DB_USER:-smart_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-smart_secret}
    volumes:
      - smart_mysql_data:/var/lib/mysql
      - ./.docker/mysql/init:/docker-entrypoint-initdb.d
      - ./.docker/mysql/conf.d:/etc/mysql/conf.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - smart_network

  # ── Redis (Cache + Queues + Sessions) ────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: smart_redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_smart}
    volumes:
      - smart_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smart_network

  # ── PHPMyAdmin ────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: smart_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root_smart_2024}
      UPLOAD_LIMIT: 100M
    depends_on:
      - mysql
    networks:
      - smart_network
    profiles:
      - tools

  # ── Node.js (Assets / Vite / Vue.js) ─────────────────────
  node:
    image: node:20-alpine
    container_name: smart_node
    working_dir: /app
    volumes:
      - ./smart-themes:/app/smart-themes
      - ./smart-modules:/app/smart-modules
      - smart_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    networks:
      - smart_network
    profiles:
      - frontend

  # ── Queue Worker (para notificaciones, emails, etc.) ──────
  queue_worker:
    build:
      context: ./.docker/php
      dockerfile: Dockerfile
    container_name: smart_queue
    volumes:
      - ./core:/var/www/html
      - ./smart-modules:/var/www/html/modules/smart
    environment:
      - APP_ENV=development
      - DB_HOST=mysql
      - REDIS_HOST=redis
    command: php /var/www/html/artisan queue:work --sleep=3 --tries=3
    depends_on:
      - mysql
      - redis
    networks:
      - smart_network
    restart: unless-stopped
    profiles:
      - workers

  # ── Mailpit (Email testing) ───────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: smart_mailpit
    ports:
      - "8025:8025"    # Web UI
      - "1025:1025"    # SMTP
    networks:
      - smart_network
    profiles:
      - tools

# ── Redes ─────────────────────────────────────────────────────
networks:
  smart_network:
    driver: bridge
    name: smart_hotel_network

# ── Volúmenes persistentes ────────────────────────────────────
volumes:
  smart_mysql_data:
    name: smart_hotel_mysql
  smart_redis_data:
    name: smart_hotel_redis
  smart_node_modules:
    name: smart_hotel_node_modules
