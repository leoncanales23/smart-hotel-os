name: SmartHotelOS CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'

jobs:
  # ────────────────────────────────────────────
  #  Análisis de código PHP
  # ────────────────────────────────────────────
  php-lint:
    name: PHP Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, curl, gd, zip, mbstring
          tools: composer:v2, phpstan, phpcs

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
        working-directory: ./core

      - name: PHP Syntax Check (lint)
        run: find smart-modules -name "*.php" -exec php -l {} \; | grep -v "No syntax errors"

      - name: PHP Code Style (PHPCS)
        run: phpcs --standard=PSR12 --extensions=php smart-modules/

      - name: PHPStan Static Analysis
        run: phpstan analyse smart-modules/ --level=5

  # ────────────────────────────────────────────
  #  Tests PHP
  # ────────────────────────────────────────────
  php-tests:
    name: PHP Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: php-lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_test
          MYSQL_DATABASE: smart_hotel_test
          MYSQL_USER: smart_test
          MYSQL_PASSWORD: smart_test_pass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, curl, gd, zip, mbstring, redis
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: ./core

      - name: Run Unit Tests
        run: vendor/bin/phpunit tests/unit/ --coverage-clover coverage.xml
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: smart_hotel_test
          DB_USER: smart_test
          DB_PASSWORD: smart_test_pass

      - name: Run Integration Tests
        run: vendor/bin/phpunit tests/integration/
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: smart_hotel_test
          DB_USER: smart_test
          DB_PASSWORD: smart_test_pass

      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml

  # ────────────────────────────────────────────
  #  Frontend Build
  # ────────────────────────────────────────────
  frontend:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run frontend tests
        run: npm test -- --coverage

  # ────────────────────────────────────────────
  #  Security Scan
  # ────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # ────────────────────────────────────────────
  #  Deploy a Staging (solo en develop)
  # ────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [php-tests, frontend, security]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /var/www/smart-hotel-staging
            git pull origin develop
            composer install --no-dev --optimize-autoloader
            npm ci && npm run build
            php artisan cache:clear
            echo "✅ Staging deployment complete"

  # ────────────────────────────────────────────
  #  Deploy a Producción (solo en main con tag)
  # ────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [php-tests, frontend, security]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: SmartHotelOS ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Deploy to Production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /var/www/smart-hotel-production
            git fetch --tags
            git checkout ${{ github.ref_name }}
            composer install --no-dev --optimize-autoloader
            npm ci && npm run build:prod
            php artisan cache:clear
            echo "🚀 Production deployment complete: ${{ github.ref_name }}"
